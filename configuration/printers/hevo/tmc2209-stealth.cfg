# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.
# based on the following stepper connections - from left to right:
# X Y E Z Z1 
# In the wiring diagram, the Z-steppers are called Z / Left Z , Z1 / Right Z , here they're mapped to z, z1 respectively.

[tmc2209 stepper_x]
stealthchop_threshold: 999999
interpolate: True

[tmc2209 stepper_y]
stealthchop_threshold: 999999
interpolate: True

[tmc2209 extruder]
uart_pin:  e_uart_pin
run_current: 0.5
stealthchop_threshold: 0

[tmc2209 stepper_z]
stealthchop_threshold: 999999
interpolate: True

[tmc2209 stepper_z1]
stealthchop_threshold: 999999
interpolate: True
